<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze Agent Visualization</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="header">
      <div>
        <p class="eyebrow">03 · Multiple-action agent</p>
        <h1>Maze visualizer</h1>
      </div>
      <div class="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <section class="workspace">
      <div class="maze-panel">
        <div class="compass" aria-hidden="true"><span>↑</span> N</div>
        <div id="maze" class="maze" role="grid" aria-label="Three by three maze">
          <div class="cell start" role="gridcell" data-x="0" data-y="0"><span class="coordinate">0, 0</span><span class="label">Start</span></div>
          <div class="cell" role="gridcell" data-x="1" data-y="0"><span class="coordinate">1, 0</span></div>
          <div class="cell key-room" role="gridcell" data-x="2" data-y="0"><span class="coordinate">2, 0</span><span id="key" class="key" aria-label="Key">◆</span><span class="label">Key</span></div>
          <div class="cell" role="gridcell" data-x="0" data-y="1"><span class="coordinate">0, 1</span></div>
          <div class="cell blocked" role="gridcell" data-x="1" data-y="1"><span class="coordinate">1, 1</span><span class="blocked-mark">×</span><span class="label">Blocked</span></div>
          <div class="cell" role="gridcell" data-x="2" data-y="1"><span class="coordinate">2, 1</span></div>
          <div class="cell" role="gridcell" data-x="0" data-y="2"><span class="coordinate">0, 2</span></div>
          <div class="cell" role="gridcell" data-x="1" data-y="2"><span class="coordinate">1, 2</span></div>
          <div class="cell exit-room" role="gridcell" data-x="2" data-y="2"><span class="coordinate">2, 2</span><span id="exit" class="exit" aria-label="Locked exit">▥</span><span class="label">Exit</span></div>
          <div id="agent" class="agent" aria-label="Agent at 0, 0"><span class="agent-eye left"></span><span class="agent-eye right"></span></div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="readout">
          <span>Position</span><strong id="positionText">(0, 0)</strong>
          <span>Inventory</span><strong id="inventoryText">Empty</strong>
          <span>Exit</span><strong id="exitText">Locked</strong>
        </div>

        <div class="controls" aria-label="Visualization controls">
          <h2>Current implementation</h2>
          <div class="direction-pad">
            <button type="button" data-direction="north" aria-label="Move north">↑</button>
            <button type="button" data-direction="west" aria-label="Move west">←</button>
            <button type="button" data-direction="south" aria-label="Move south">↓</button>
            <button type="button" data-direction="east" aria-label="Move east">→</button>
          </div>
          <div class="action-buttons">
            <button id="autoButton" type="button">Run agent</button>
            <button id="inspectButton" type="button">Inspect cell</button>
            <button id="thinkButton" type="button">Think + act</button>
            <button id="takeButton" type="button">Take key</button>
            <button id="unlockButton" type="button">Unlock exit</button>
            <button id="resetButton" type="button" class="secondary">Reset</button>
          </div>
        </div>

        <div class="event-log">
          <h2>Visualization events</h2>
          <ol id="eventLog" aria-live="polite"></ol>
        </div>
      </aside>
    </section>
  </main>
  <script src="visualization.js"></script>
  <script src="app.js"></script>
</body>
</html>
